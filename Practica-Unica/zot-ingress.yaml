apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zot-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: zot.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zot-service
            port:
              number: 5000
