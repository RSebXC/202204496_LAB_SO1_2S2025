apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service
  namespace: dev
  labels:
    app: go-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-service
  template:
    metadata:
      labels:
        app: go-service
    spec:
      containers:
      - name: go-service
        image: 34.122.62.252:5000/go-service:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      imagePullSecrets:
      - name: zot-registry
---
apiVersion: v1
kind: Service
metadata:
  name: go-service
  namespace: dev
spec:
  selector:
    app: go-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
