apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: dev
  labels:
    app: kafka-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
      - name: kafka-consumer
        image: 34.122.62.252:5000/kafka-consumer:latest
        env:
        - name: REDIS_HOST
          value: "valkey-redis-master"
        - name: REDIS_PORT  
          value: "6379"
        - name: REDIS_PASSWORD
          value: "valkey123"
        - name: KAFKA_BROKERS
          value: "my-kafka-kafka-bootstrap:9092"
        - name: KAFKA_TOPIC
          value: "weather-tweets"
        - name: KAFKA_GROUP_ID
          value: "kafka-consumer"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
