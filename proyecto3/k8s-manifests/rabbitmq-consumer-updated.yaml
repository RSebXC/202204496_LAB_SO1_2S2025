apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-consumer
  namespace: dev
  labels:
    app: rabbitmq-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-consumer
  template:
    metadata:
      labels:
        app: rabbitmq-consumer
    spec:
      containers:
      - name: rabbitmq-consumer
        image: 34.122.62.252:5000/rabbitmq-consumer:latest
        env:
        - name: REDIS_HOST
          value: "valkey-redis-master"
        - name: REDIS_PORT  
          value: "6379"
        - name: REDIS_PASSWORD
          value: "valkey123"
        - name: RABBITMQ_URL
          value: "amqp://admin:admin123@rabbitmq:5672/"
        - name: RABBITMQ_QUEUE
          value: "weather-tweets"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
