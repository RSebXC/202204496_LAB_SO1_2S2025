apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-service
  namespace: dev
  labels:
    app: rabbitmq-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-service
  template:
    metadata:
      labels:
        app: rabbitmq-service
    spec:
      containers:
      - name: rabbitmq-service
        image: 34.122.62.252:5000/rabbitmq-service:latest
        ports:
        - containerPort: 9000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      imagePullSecrets:
      - name: zot-registry
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: dev
spec:
  selector:
    app: rabbitmq-service
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
