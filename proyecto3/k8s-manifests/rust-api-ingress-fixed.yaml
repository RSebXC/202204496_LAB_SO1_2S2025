apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rust-api-ingress
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /tweet
        pathType: Prefix
        backend:
          service:
            name: rust-api
            port:
              number: 8080
