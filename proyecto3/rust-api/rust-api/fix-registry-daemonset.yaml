apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-config
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: registry-config
  template:
    metadata:
      labels:
        name: registry-config
    spec:
      hostPID: true
      hostNetwork: true
      containers:
      - name: registry-config
        image: alpine
        command: 
        - /bin/sh
        - -c
        - |
          nsenter --target 1 --mount --uts --ipc --net --pid -- sh -c '
          mkdir -p /etc/containerd/certs.d/34.122.62.252:5000
          cat > /etc/containerd/certs.d/34.122.62.252:5000/hosts.toml <<EOL
          server = "http://34.122.62.252:5000"
          [host."http://34.122.62.252:5000"]
            capabilities = ["pull", "resolve", "push"]
            skip_verify = true
          EOL
          systemctl restart containerd || /bin/true
          '
          echo "Registry config applied"
          sleep infinity
        securityContext:
          privileged: true
      tolerations:
      - effect: NoSchedule
        operator: Exists
